[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evm-gasfit"
version = "0.1.0"
description = "Estimate worst-case EVM gas costs from runtime measurements."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Maria Silva", email = "misilva73@gmail.com" }]
keywords = ["ethereum", "evm", "gas", "nnls", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "mdutils",
]

[project.optional-dependencies]
# Soft runtime extra (plan §2.4): pull per-fork GasCosts from the execution-specs
# package. The package falls back to `defaults/_fallback.py` if this isn't installed.
specs = ["ethereum-execution"]

# Docs site build (plan §11). Kept as a project extra (not a dependency-group)
# so the GitHub Actions workflow can install it with plain pip: `pip install -e ".[docs]"`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
]

# PEP 735 dependency groups — dev-only tools live here so they don't leak into
# `pip install evm-gasfit[...]`. `uv sync` installs them by default;
# `uv sync --no-dev` excludes them.
[dependency-groups]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/misilva73/evm-gasfit"
Repository = "https://github.com/misilva73/evm-gasfit"
Documentation = "https://misilva73.github.io/evm-gasfit/"
Issues = "https://github.com/misilva73/evm-gasfit/issues"

[project.scripts]
evm-gasfit = "evm_gasfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
