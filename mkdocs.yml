site_name: evm-gasfit
site_description: Estimate worst-case EVM gas costs from runtime measurements.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - gen_presets.py
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true

nav:
  - Overview:
      - Home: index.md
      - Install & quickstart: guides/quickstart.md
  - Guides:
      - Writing custom ModelSpecs: guides/custom-modelspecs.md
      - Reading the outputs: guides/outputs.md
  - Concepts:
      - NNLS modeling: concepts/nnls.md
      - Glue adjustment: concepts/glue.md
      - Deriving gas params: concepts/gas-params.md
  - Reference:
      - Config (YAML): reference/config.md
      - Preset catalog: reference/presets.md
      - API: api.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
